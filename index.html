  async function saveRates() {
    const g = id => toInt($('#' + id).value);
    const t = { day: g('rt_day'), night: g('rt_night'), late: g('rt_late'), allow: g('rt_allow') };
    const r = { day: g('rr_day'), night: g('rr_night'), late: g('rr_late'), allow: g('rr_allow') };
    const d = {
      earlyOnly: g('rd_e'), lateOnly: g('rd_l'), both: g('rd_b'), okuri: g('rd_o'),
      earlyTime: $('#rd_et').value.trim(), lateTime: $('#rd_lt').value.trim(), okuriTime: $('#rd_ot').value.trim()
    };
    if (!t.day || !r.day) { toast('仲居の〜22時の時給を入れてください'); return; }
    const warns = [];
    for (const [label, x] of [['研修中', t], ['研修後', r]]) {
      const need = Math.ceil(x.day * 1.25);
      if (x.night < need || x.late + x.allow < need) warns.push(`・${label}：22時以降が〜22時の1.25倍（${yenStr(need)}）に届いていません`);
    }
    if (warns.length) {
      const ok = await confirmModal(`${warns.join('\n')}\n\n22時〜翌5時の勤務には、25%以上の深夜割増が必要です（労働基準法37条）。このまま保存しますか？`, { title: '深夜割増の確認', ok: 'このまま保存' });
      if (!ok || !S.data) return;
    }
    const R = S.data.settings.rates;
    Object.assign(R.trainee, t); Object.assign(R.regular, r); Object.assign(R.driver, d);
    await persist();
    toast('単価を保存しました。これからの計算に使われます');
  }
  async function resetRates() {
    if (!await confirmModal('単価を最初の設定（仲居 研修中1,250円／研修後1,300円など）に戻します。保存済みの記録は変わりません。', { title: '最初の単価に戻す', ok: '戻す' })) return;
    S.data.settings.rates = DEFAULT_SETTINGS().rates;
    await persist(); renderView(); toast('最初の単価に戻しました');
  }
  async function savePresets() {
    const rows = readPresetRows().filter(p => p.name);
    S.data.settings.presets = rows;
    S.presetDraft = null;
    const ids = new Set(rows.map(p => p.id));
    S.data.staff.forEach(s => { s.deds = (s.deds || []).filter(x => ids.has(x)); });
    await persist();
    $('#presetRows').innerHTML = presetRowsHTML();
    toast('差し引きの項目を保存しました');
  }

  function changePass() {
    openModal({
      title: 'パスコードを変える',
      html: `<label class="field" for="cpOld"><span class="lab">今のパスコード</span><input id="cpOld" type="password" autocomplete="current-password" autocapitalize="off"></label>
        <label class="field" for="cpNew1"><span class="lab">新しいパスコード（4文字以上）</span><input id="cpNew1" type="password" autocomplete="new-password" autocapitalize="off"></label>
        <label class="field" for="cpNew2"><span class="lab">新しいパスコード（もう一度）</span><input id="cpNew2" type="password" autocomplete="new-password" autocapitalize="off"></label>
        <p class="err" id="cpErr" role="alert"></p>`,
      actions: [
        { label: 'やめる', kind: 'ghost' },
        {
          label: '変更する', kind: 'primary',
          run: async () => {
            const o = $('#cpOld').value, n1 = $('#cpNew1').value, n2 = $('#cpNew2').value, err = $('#cpErr');
            if (n1.normalize('NFKC').length < 4) { err.textContent = '新しいパスコードは4文字以上にしてください'; return false; }
            if (n1.normalize('NFKC') !== n2.normalize('NFKC')) { err.textContent = '新しいパスコードが1回目と2回目で違います'; return false; }
            err.textContent = '確認しています…';
            await S.saving;
            try { await openBox(readVault(), o); } catch (e) { err.textContent = '今のパスコードが違います'; return false; }
            const salt = crypto.getRandomValues(new Uint8Array(16));
            S.key = await deriveKey(n1, salt, ITER); S.salt = salt; S.iter = ITER;
            await persist();
            toast('パスコードを変えました');
            return true;
          }
        }
      ],
      onOpen: () => $('#cpOld').focus()
    });
  }

  async function exportBackup(copy) {
    await S.saving;
    const vault = readVault();
    if (!vault) { toast('バックアップするデータがありません'); return; }
    const text = JSON.stringify({ app: 'hibarai-kyuyo', kind: 'backup', v: 1, exportedAt: new Date().toISOString(), vault });
    if (copy) { copyOrShow(text, 'バックアップ', 'この文字をメモ帳などに貼って保管してください。復元には今のパスコードが必要です。'); return; }
    downloadText(`hibarai-backup-${bizToday()}.json`, text, 'application/json');
    toast('バックアップを書き出しました。復元には今のパスコードが必要です', { ms: 7000 });
  }
  function restorePaste() {
    openModal({
      title: '貼り付けて復元',
      html: '<label class="field" for="rsText"><span class="lab">バックアップの文字</span><textarea id="rsText" class="copy-area" rows="7" placeholder="コピーしておいたバックアップを、ここに貼り付けます"></textarea></label>',
      actions: [
        { label: 'やめる', kind: 'ghost' },
        { label: '次へ', kind: 'primary', run: () => { const t = $('#rsText').value.trim(); if (!t) return false; setTimeout(() => restoreFrom(t), 0); return true; } }
      ],
      onOpen: () => $('#rsText').focus()
    });
  }
  function readFileText(f) {
    if (f.text) return f.text();
    return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsText(f); });
  }
  async function restoreFrom(text) {
    let box = null;
    try { const o = JSON.parse(text); box = o && o.vault ? o.vault : o; } catch (e) { box = null; }
    if (!box || !box.ct || !box.iv || !box.salt) { toast('バックアップの形式ではありません'); return; }
    const data = await openModal({
      title: 'バックアップのパスコード',
      html: `<p class="hint">バックアップを作ったときのパスコードを入れてください。</p>
        <label class="field" for="rsPass"><span class="lab">パスコード</span><input id="rsPass" type="password" autocomplete="off" autocapitalize="off"></label>
        <p class="err" id="rsErr" role="alert"></p>`,
      actions: [
        { label: 'やめる', kind: 'ghost' },
        {
          label: '読み込む', kind: 'primary',
          run: async () => {
            $('#rsErr').textContent = '確認しています…';
            try { const o = await openBox(box, $('#rsPass').value); return normalizeData(o.data); }
            catch (e) { $('#rsErr').textContent = 'パスコードが違うか、バックアップが壊れています'; return false; }
          }
        }
      ],
      onOpen: () => $('#rsPass').focus()
    });
    if (!data || !Array.isArray(data.records) || !S.data) return;
    const ok = await confirmModal(`バックアップ（記録${data.records.length}件・スタッフ${data.staff.length}人）で、今のデータをすべて置き換えます。パスコードは今のままです。`, { title: '復元の確認', ok: '置き換える', danger: true });
    if (!ok || !S.data) return;
    S.data = data;
    await persist();
    S.draft = newDraft();
    renderView();
    toast('バックアップから復元しました');
  }
  async function wipeAll() {
    if (!await confirmModal('この端末の記録・スタッフ・設定・パスコードをすべて消して、最初の画面に戻ります。元に戻せません。', { title: 'すべてのデータを消去', ok: 'すべて消去する', danger: true })) return;
    await S.saving;
    Store.del(K_VAULT); Store.del(K_META);
    lock();
    toast('すべてのデータを消去しました');
  }

  /* ---------- 共有・コピー・書き出し ---------- */
  async function shareText(text) {
    const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    if (navigator.share && touch) {
      try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(text); toast('明細をコピーしました。LINEなどに貼り付けて送れます'); return; } catch (e) { /* 下へ */ }
    showCopyModal('明細', text);
  }
  async function copyOrShow(text, label, hint) {
    try { await navigator.clipboard.writeText(text); toast(`${label}をコピーしました`); } catch (e) { showCopyModal(label, text, hint); }
  }
  function showCopyModal(title, text, hint) {
    openModal({
      title,
      html: `<textarea id="copyArea" class="copy-area" readonly rows="12">${esc(text)}</textarea><p class="hint">${esc(hint || '文字を長押しして「すべてを選択」→「コピー」してください。')}</p>`,
      actions: [
        {
          label: 'コピーする', kind: 'line',
          run: async () => {
            const ta = $('#copyArea'); ta.focus(); ta.select();
            try { await navigator.clipboard.writeText(text); toast('コピーしました'); return true; } catch (e) { /* 下へ */ }
            try { if (document.execCommand('copy')) { toast('コピーしました'); return true; } } catch (e) { /* 下へ */ }
            toast('自動でコピーできませんでした。文字を選んでコピーしてください');
            return false;
          }
        },
        { label: '閉じる', kind: 'primary' }
      ],
      onOpen: () => { const ta = $('#copyArea'); ta.focus(); ta.select(); }
    });
  }
  function downloadText(filename, text, mime) {
    try {
      const url = URL.createObjectURL(new Blob([text], { type: mime }));
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    } catch (e) { toast('書き出せませんでした。コピーを使ってください'); }
  }

  /* ---------- ダイアログ・お知らせ ---------- */
  let modalSeq = 0, modalResolve = null, lastFocus = null;
  function openModal({ title, html, actions = [{ label: '閉じる', kind: 'primary' }], onOpen }) {
    closeModal(null);
    const seq = ++modalSeq;
    $('#modalTitle').textContent = title || '';
    $('#modalBody').innerHTML = html || '';
    const box = $('#modalActions');
    box.innerHTML = '';
    return new Promise(resolve => {
      modalResolve = resolve;
      for (const a of actions) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = `btn ${a.kind || 'line'}`; b.textContent = a.label;
        b.addEventListener('click', async () => {
          if (b.disabled) return;
          let v = a.value !== undefined ? a.value : null;
          if (a.run) {
            b.disabled = true;
            let r;
            try { r = await a.run(b); } catch (e) { console.error(e); r = false; }
            b.disabled = false;
            if (r === false) return;
            v = r === undefined || r === true ? (a.value !== undefined ? a.value : true) : r;
          }
          if (seq === modalSeq) closeModal(v);
        });
        box.appendChild(b);
      }
      lastFocus = document.activeElement;
      $('#modal').hidden = false;
      setTimeout(() => { if (seq !== modalSeq) return; if (onOpen) onOpen(); else { const f = box.lastElementChild; if (f) f.focus(); } }, 40);
    });
  }
  function closeModal(value) {
    const m = $('#modal');
    if (m.hidden) return;
    m.hidden = true;
    $('#modalBody').innerHTML = '';
    $('#modalActions').innerHTML = '';
    const r = modalResolve;
    modalResolve = null;
    if (r) r(value === undefined ? null : value);
    if (lastFocus && document.contains(lastFocus) && !$('#app').hidden) { try { lastFocus.focus({ preventScroll: true }); } catch (e) { /* 無視 */ } }
  }
  function confirmModal(msg, o = {}) {
    return openModal({
      title: o.title || '確認',
      html: `<p class="confirm-msg">${esc(msg)}</p>`,
      actions: [{ label: o.cancel || 'やめる', kind: 'ghost' }, { label: o.ok || 'OK', kind: o.danger ? 'danger' : 'primary', value: true }]
    }).then(v => v === true);
  }
  $('#modal').addEventListener('click', e => { if (e.target.matches('[data-modal-close]')) closeModal(null); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(null); });

  let toastTimer = null;
  function toast(msg, o = {}) {
    $('#toastMsg').textContent = msg;
    const act = $('#toastAct');
    if (o.action) {
      act.hidden = false; act.textContent = o.action.label;
      act.onclick = () => { hideToast(); o.action.fn(); };
    } else { act.hidden = true; act.onclick = null; }
    $('#toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, o.ms || (o.action ? 7000 : 3200));
  }
  function hideToast() { clearTimeout(toastTimer); $('#toast').hidden = true; }

  /* ---------- 操作の受け付け ---------- */
  const ACT = {
    lock: () => lock(),
    save: () => saveDraft(),
    cancelEdit: () => { S.draft = newDraft({ date: S.draft.date }); renderView(); },
    clearDraft: () => { S.draft = newDraft({ date: S.draft.date, role: S.draft.role }); renderView(); toast('入力を消しました'); },
    now: el => { S.draft[el.dataset.t] = nowHM(); refreshRole(); },
    toggleBrk: () => {
      const d = S.draft;
      d.brkOn = !d.brkOn;
      if (!d.brkOn) { d.brkStart = ''; d.brkEnd = ''; }
      refreshRole();
      if (d.brkOn) setTimeout(() => { const f = $('#fBrkS'); if (f) f.focus(); }, 0);
    },
    pickup: el => { S.draft.pickup = el.dataset.v; refreshRole(); },
    okuri: () => { S.draft.okuri = !S.draft.okuri; refreshRole(); },
    addItem: el => {
      const l = el.dataset.list;
      S.draft[l].push({ name: '', amount: 0 });
      refreshList(l);
      const f = $(`#${l}N${S.draft[l].length - 1}`); if (f) f.focus();
    },
    addPreset: el => {
      const p = S.data.settings.presets.find(x => x.id === el.dataset.id);
      if (!p) return;
      S.draft.deds.push({ name: p.name, amount: p.amount });
      refreshList('deds');
      if (!p.amount) { const f = $(`#dedsA${S.draft.deds.length - 1}`); if (f) f.focus(); }
    },
    delItem: el => { const it = el.closest('.item'), l = it.dataset.list; S.draft[l].splice(+it.dataset.i, 1); refreshList(l); },
    pickStaff: el => pickStaff(el.dataset.id),
    shareDraft: () => shareDraft(),
    deleteRec: el => deleteRecord(el.dataset.id),
    dayPrev: () => { S.hist.date = addDays(S.hist.date, -1); renderView(); },
    dayNext: () => { S.hist.date = addDays(S.hist.date, 1); renderView(); },
    monPrev: () => { S.hist.month = addMonths(S.hist.month, -1); renderView(); },
    monNext: () => { S.hist.month = addMonths(S.hist.month, 1); renderView(); },
    histToday: () => { const t = bizToday(); S.hist.date = t; S.hist.month = t.slice(0, 7); renderView(); },
    openRec: el => openRecord(el.dataset.id),
    togglePaid: el => togglePaid(el.dataset.id),
    goCalcDate: () => { S.draft = newDraft({ date: S.hist.date }); go('calc'); },
    csvFile: () => exportCsv(false),
    csvCopy: () => exportCsv(true),
    addStaff: () => editStaff(null),
    editStaff: el => editStaff(el.dataset.id),
    endTraining: el => endTraining(el.dataset.id),
    saveRates: () => saveRates(),
    resetRates: () => resetRates(),
    addPresetRow: () => {
      S.presetDraft = readPresetRows();
      S.presetDraft.push({ id: uid('p'), name: '', amount: 0 });
      $('#presetRows').innerHTML = presetRowsHTML();
      const f = $(`#pn${S.presetDraft.length - 1}`); if (f) f.focus();
    },
    delPresetRow: el => { S.presetDraft = readPresetRows(); S.presetDraft.splice(+el.dataset.i, 1); $('#presetRows').innerHTML = presetRowsHTML(); },
    savePresets: () => savePresets(),
    changePass: () => changePass(),
    backupFile: () => exportBackup(false),
    backupCopy: () => exportBackup(true),
    restorePaste: () => restorePaste(),
    wipe: () => wipeAll()
  };
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-seg],[data-act]');
    if (!t || !S.data || t.closest('#lock')) return;
    if (t.disabled) return;
    if (t.dataset.go) { go(t.dataset.go); return; }
    if (t.dataset.seg) { onSeg(t.dataset.seg, t.dataset.v); return; }
    const fn = ACT[t.dataset.act];
    if (fn) fn(t, e);
  });
  function onSeg(group, v) {
    const d = S.draft;
    if (group === 'role' && d) { d.role = v; if (v === 'driver') d.trainee = false; setPressed('role', v); refreshRole(); }
    else if (group === 'trainee' && d) { d.trainee = v === '1'; refreshRole(); }
    else if (group === 'histMode') { S.hist.mode = v; renderView(); }
    else if (group === 'stRole') { setPressed('stRole', v); const row = $('#stTraineeRow'); if (row) row.hidden = v === 'driver'; }
  }
  function onField(t) {
    const d = S.draft;
    if (!d || S.view !== 'calc') return;
    const f = t.dataset.f;
    d[f] = t.value;
    if (f === 'name') { d.staffId = matchStaffId(t.value); refreshChips(); }
    if (f === 'start' || f === 'end' || f === 'brkStart' || f === 'brkEnd') refreshOutputs();
  }
  const INPUT = {
    itemName: t => { const it = t.closest('.item'), arr = S.draft && S.draft[it.dataset.list]; if (arr && arr[+it.dataset.i]) arr[+it.dataset.i].name = t.value; },
    itemAmt: t => { const it = t.closest('.item'), arr = S.draft && S.draft[it.dataset.list]; if (arr && arr[+it.dataset.i]) { arr[+it.dataset.i].amount = toInt(t.value); refreshOutputs(); } }
  };
  const CHANGE = {
    histDate: t => { if (isYmd(t.value)) { S.hist.date = t.value; renderView(); } },
    optHidden: t => { writeMeta({ hidden: t.checked }); toast(t.checked ? 'シークレットログインをオンにしました' : 'シークレットログインをオフにしました'); },
    optAuto: t => { S.data.settings.autoLock = +t.value; persist(); toast(+t.value ? `${t.value}分操作しないとロックします` : '自動ロックをオフにしました'); },
    restoreFile: t => { const f = t.files && t.files[0]; t.value = ''; if (f) readFileText(f).then(restoreFrom).catch(() => toast('ファイルを読めませんでした')); }
  };
  document.addEventListener('input', e => {
    const t = e.target;
    if (!S.data || !t.dataset) return;
    if (t.dataset.f) { onField(t); return; }
    const h = INPUT[t.dataset.in]; if (h) h(t, e);
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (!S.data || !t.dataset) return;
    if (t.dataset.f) { onField(t); return; }
    const h = CHANGE[t.dataset.in]; if (h) h(t, e);
  });

  /* ---------- 自動ロック ---------- */
  ['pointerdown', 'keydown', 'touchstart', 'wheel', 'input'].forEach(ev => document.addEventListener(ev, () => { S.lastActive = Date.now(); }, { capture: true, passive: true }));
  function checkIdle() {
    if (!S.key || !S.data) return;
    const m = S.data.settings.autoLock;
    if (m > 0 && Date.now() - S.lastActive > m * 60000) lock();
  }
  setInterval(checkIdle, 15000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkIdle(); });
  window.addEventListener('pageshow', checkIdle);

  showLock();
})();

</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
